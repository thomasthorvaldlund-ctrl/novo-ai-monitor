<section style="
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:22px;
    margin-bottom:24px;
">
    <h2 style="margin-top:0;">
        🔍 {{ pattern_detection.headline }}
    </h2>

    <p style="color:#64748b;margin-bottom:18px;">
        Finder tilbagevendende mønstre i AI'ens historiske signaler og aktievurderinger.
    </p>

    <div style="
        display:grid;
        grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
        gap:14px;
    ">
        {% for pattern in pattern_detection.patterns %}
            <div style="
                background:#f8fafc;
                border:1px solid #e5e7eb;
                border-radius:10px;
                padding:16px;
                color:#334155;
                line-height:1.6;
            ">
                {{ pattern }}
            </div>
        {% endfor %}
    </div>
</section>
