<div class="card">
    <h2>🎯 AI Strategy Engine</h2>

    <p style="color: #64748b; margin-bottom: 16px;">
        Omsætter AI Context Engine til en samlet investeringsstrategi.
    </p>

    <div style="
        padding: 16px;
        border-radius: 10px;
        background: #f8fafc;
        margin-bottom: 14px;
    ">
        <span style="color: #64748b;">Aktuel strategi</span>

        <div style="
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        ">
            {{ ai_strategy.strategy }}
        </div>
    </div>

    <p style="margin-bottom: 14px;">
        {{ ai_strategy.description }}
    </p>

    <div style="
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    ">
        <div>
            <span style="color: #64748b;">AI confidence</span>
            <div style="font-weight: 700;">
                {{ ai_strategy.confidence }}
            </div>
        </div>

        <div>
            <span style="color: #64748b;">Forventet præcision</span>
            <div style="font-weight: 700;">
                {{ ai_strategy.prediction_accuracy }}%
            </div>
        </div>
    </div>
</div>
